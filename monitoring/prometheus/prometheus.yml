global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: qdrant
    metrics_path: /metrics
    authorization:
      type: Bearer
      # 컨테이너 entrypoint 가 docker.env 의 QDRANT__SERVICE__API_KEY 로 생성한다.
      credentials_file: /tmp/qdrant_api_key
    static_configs:
      - targets: ["qdrant:6333"]

  # 호스트에서 실행 중인 FastAPI(uvicorn :8000). /metrics 는 /api 밖 루트 경로.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
