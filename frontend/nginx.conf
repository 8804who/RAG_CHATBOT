server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API proxy, mirroring the Vite dev proxy (session cookies just work).
    location /api/ {
        # Re-resolve via Docker DNS so nginx boots without `api` and follows its IP on recreate.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        # With a variable, pass the raw URI (path + query) explicitly.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat is non-streaming and can take ~30-60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Document uploads; nginx default is 1m.
        client_max_body_size 50m;
    }

    # Vite emits content-hashed files here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
